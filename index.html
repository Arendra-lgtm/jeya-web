<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>I LOVE U SO MUCH BABE ❤️</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{

      background: linear-gradient(
        135deg,
        #ffb7d5,
        #e6c3ff,
        #d7b8ff,
        #ffcce6,
        #cdb4ff
      );

      background-size:400% 400%;
      animation:gradientMove 12s ease infinite;

      overflow-x:hidden;
      min-height:100vh;
      color:white;
    }

    @keyframes gradientMove{
      0%{
        background-position:0% 50%;
      }
      50%{
        background-position:100% 50%;
      }
      100%{
        background-position:0% 50%;
      }
    }

    /* ===== FLOATING HEART ===== */

    .hearts{
      position:fixed;
      width:100%;
      height:100%;
      top:0;
      left:0;
      overflow:hidden;
      z-index:-1;
    }

    .heart{
      position:absolute;
      bottom:-50px;
      color:rgba(255,255,255,0.5);
      animation:floatUp linear infinite;
      font-size:20px;
    }

    @keyframes floatUp{

      0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
      }

      10%{
        opacity:1;
      }

      100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
      }
    }

    /* ===== PASSWORD PAGE ===== */

    .password-page{
      width:100%;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .password-box{

      width:100%;
      max-width:380px;

      background:rgba(255,255,255,0.15);

      backdrop-filter:blur(12px);

      border:1px solid rgba(255,255,255,0.25);

      border-radius:30px;

      padding:40px 30px;

      text-align:center;

      box-shadow:0 10px 30px rgba(0,0,0,0.2);

      animation:fadeIn 1s ease;
    }

    .password-box h1{
      font-size:2rem;
      margin-bottom:10px;
    }

    .password-box p{
      color:#fff5fb;
      margin-bottom:25px;
    }

    .password-box input{

      width:100%;

      padding:15px;

      border:none;

      border-radius:15px;

      outline:none;

      text-align:center;

      font-size:1rem;

      margin-bottom:20px;
    }

    .password-box button{

      width:100%;

      padding:15px;

      border:none;

      border-radius:15px;

      background:#ff5eb2;

      color:white;

      font-size:1rem;

      cursor:pointer;

      transition:0.3s;

      font-weight:bold;
    }

    .password-box button:hover{
      transform:scale(1.03);
      background:#ff3f9d;
    }

    .error{
      margin-top:15px;
      color:#fff0f7;
      font-size:0.9rem;
    }

    /* ===== GALLERY ===== */

    .gallery-page{
      display:none;
      padding:30px 20px 100px;
      animation:fadeIn 1s ease;
    }

    .title{
      text-align:center;
      margin-bottom:35px;
    }

    .title h1{
      font-size:2.5rem;
      margin-bottom:10px;
    }

    .title p{
      color:#fff3fa;
    }

    .gallery{

      display:grid;

      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

      gap:20px;

      max-width:1200px;

      margin:auto;
    }

    .photo{

      position:relative;

      overflow:hidden;

      border-radius:25px;

      background:rgba(255,255,255,0.15);

      border:2px solid rgba(255,255,255,0.25);

      aspect-ratio:3/4;

      box-shadow:0 10px 25px rgba(0,0,0,0.15);

      transition:0.4s;
    }

    .photo:hover{
      transform:translateY(-8px) scale(1.03);
    }

    .photo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .photo::after{

      content:"❤";

      position:absolute;

      top:10px;

      right:10px;

      width:35px;

      height:35px;

      display:flex;

      align-items:center;

      justify-content:center;

      border-radius:50%;

      background:rgba(255,255,255,0.2);

      backdrop-filter:blur(5px);
    }

    /* ===== MUSIC BUTTON ===== */

    .music-btn{

      position:fixed;

      bottom:25px;

      right:25px;

      width:65px;

      height:65px;

      border:none;

      border-radius:50%;

      background:#ff5eb2;

      color:white;

      font-size:25px;

      cursor:pointer;

      box-shadow:0 10px 25px rgba(0,0,0,0.2);

      transition:0.3s;

      z-index:999;
    }

    .music-btn:hover{
      transform:scale(1.1);
    }

    .spin{
      animation:spin 3s linear infinite;
    }

    @keyframes spin{
      from{
        transform:rotate(0deg);
      }
      to{
        transform:rotate(360deg);
      }
    }

    /* ===== FADE ===== */

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* ===== RESPONSIVE ===== */

    @media(max-width:600px){

      .title h1{
        font-size:2rem;
      }

      .gallery{
        grid-template-columns:repeat(2,1fr);
      }

      .music-btn{
        width:58px;
        height:58px;
        font-size:22px;
      }
    }

  </style>
</head>

<body>

  <!-- HEART EFFECT -->
  <div class="hearts" id="hearts"></div>

  <!-- PASSWORD PAGE -->
  <div class="password-page" id="passwordPage">

    <div class="password-box">

      <h1>❤️Jeya Gallery❤️</h1>

      <p>
        Password nya tanggal & bulan jadian kita
      </p>

      <input 
        type="password"
        id="passwordInput"
        placeholder="Password..."
      >

      <button onclick="checkPassword()">
        Open Gallery 💌
      </button>

      <div class="error" id="errorText"></div>

    </div>

  </div>

  <!-- GALLERY -->
  <div class="gallery-page" id="galleryPage">

    <div class="title">

      <h1>I LOVE U SO MUCH BABE❤️</h1>

      <p>
        Every moment with you is special.
      </p>

    </div>

    <div class="gallery">

      <!-- GANTI FOTO DI SINI -->

      <div class="photo">
        <img src="zela1.jpeg">
      </div>

      <div class="photo">
        <img src="zela2.jpeg">
      </div>

      <div class="photo">
        <img src="zela3.jpeg">
      </div>

      <div class="photo">
        <img src="zela4.jpeg">
      </div>

      <div class="photo">
        <img src="zela5.jpeg">
      </div>

      <div class="photo">
        <img src="zela6.jpeg">
      </div>

    </div>

  </div>

  <!-- MUSIC -->
  <!-- GANTI music.mp3 DENGAN LAGU LU -->
  <audio id="bgMusic" loop>
    <source src="LANY - Out Of My League.mp3" type="audio/mp3">
  </audio>

  <!-- MUSIC BUTTON -->
  <button class="music-btn" id="musicBtn">
    🎵
  </button>

  <script>

    // =========================================
    // PASSWORD
    // =========================================

    // GANTI PASSWORD DI SINI
    const correctPassword = "1309";

    function checkPassword(){

      const input = document.getElementById("passwordInput").value;

      const error = document.getElementById("errorText");

      if(input === correctPassword){

        document.getElementById("passwordPage")
          .style.display = "none";

        document.getElementById("galleryPage")
          .style.display = "block";

      }else{

        error.innerHTML = "Password salah 😭";
      }
    }

    // ENTER BUTTON

    document
      .getElementById("passwordInput")
      .addEventListener("keypress",function(e){

        if(e.key === "Enter"){
          checkPassword();
        }

      });

    // =========================================
    // MUSIC
    // =========================================

    const music = document.getElementById("bgMusic");

    const musicBtn = document.getElementById("musicBtn");

    let isPlaying = false;

    musicBtn.addEventListener("click", () => {

      if(isPlaying){

        music.pause();

        musicBtn.classList.remove("spin");

      }else{

        music.play();

        musicBtn.classList.add("spin");
      }

      isPlaying = !isPlaying;

    });

    // =========================================
    // FLOATING HEART
    // =========================================

    const heartsContainer =
      document.getElementById("hearts");

    function createHeart(){

      const heart = document.createElement("div");

      heart.classList.add("heart");

      heart.innerHTML = "❤";

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.fontSize =
        Math.random() * 20 + 15 + "px";

      heart.style.animationDuration =
        Math.random() * 5 + 5 + "s";

      heartsContainer.appendChild(heart);

      setTimeout(() => {

        heart.remove();

      },10000);
    }

    setInterval(createHeart,300);

  </script>

</body>
</html>
